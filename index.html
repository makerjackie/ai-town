<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型镇 · MODEL TOWN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <header class="chrome top">
      <p class="eyebrow">精致沙盘 · MODEL DIORAMA</p>
      <h1>模型镇</h1>
    </header>

    <aside id="board" class="board">
      <p class="board-kicker">小镇排行榜 · 点我切榜</p>
      <h2 id="board-metric">智力</h2>
      <ol id="board-list"></ol>
      <p id="board-hint" class="board-hint">夜市传言，不是财报</p>
      <p id="board-source" class="board-source">Artificial Analysis</p>
    </aside>

    <aside id="plaque" class="plaque hidden" hidden>
      <p class="plaque-kicker"></p>
      <h2 class="plaque-title"></h2>
      <p class="plaque-body"></p>
    </aside>

    <div id="rheo" class="rheo">
      <p class="rheo-kicker">DeepSeek 滑动变阻器 · R</p>
      <p id="rheo-value">$0.28 / 1M tokens</p>
      <div class="rheo-track"><i id="rheo-fill"></i></div>
    </div>

    <footer class="chrome bottom">
      <p id="hint">WASD 走路 · F 电影镜头 · V 斜俯 · C 巡游 · L 切榜 · R 拧变阻器</p>
    </footer>

    <div id="loader">
      <div class="loader-mark">模</div>
      <p>正在铺沙盘…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
